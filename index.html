
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Découvrez des livres, leurs résumés et leurs personnages dans Tous les résumés, une bibliothèque de lecture personnelle.">
  <meta name="robots" content="index, follow">

  <title>Tous les résumés — Bibliothèque de livres</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f7f3ed;
      color: #302c28;
    }

    header {
      padding: 55px 20px 40px;
      text-align: center;
      background: #e8dfd2;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 48px;
      font-weight: normal;
    }

    header p {
      margin: 0;
      font-size: 18px;
      color: #6d6258;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .search {
      display: flex;
      gap: 12px;
      margin-bottom: 35px;
    }

    .search input,
    .search select {
      padding: 14px;
      border: 1px solid #d2c7ba;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

    .search input {
      flex: 1;
      min-width: 0;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .book {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .book:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    }

    .cover {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #ddd;
    }

    .book-content {
      padding: 18px;
    }

    .book h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .author {
      color: #756a60;
      margin-bottom: 10px;
    }

    .genre {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee6dc;
      font-size: 13px;
      color: #65594e;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #756a60;
    }

    .hidden {
      display: none !important;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 30px;
      color: #5d5146;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .back-button:hover {
      text-decoration: underline;
    }

    .share-button {
      display: inline-block;
      margin: 0 0 24px;
      padding: 10px 16px;
      border: 1px solid #d2c7ba;
      border-radius: 8px;
      background: white;
      color: #5d5146;
      font: inherit;
      cursor: pointer;
    }

    .share-button:hover {
      background: #f3eee8;
    }

    .share-status {
      margin: 0 0 20px;
      color: #526b48;
      font-size: 14px;
    }

    .detail {
      background: white;
      border-radius: 14px;
      padding: 35px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .detail-top {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    .detail-cover {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      border-radius: 8px;
    }

    .detail h1 {
      font-size: 42px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .detail-author {
      font-size: 21px;
      color: #756a60;
      margin-bottom: 25px;
    }

    .info {
      color: #62584f;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .section {
      margin-top: 35px;
    }

    .section h2 {
      font-size: 27px;
      font-weight: normal;
      border-bottom: 1px solid #ddd3c8;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .summary {
      line-height: 1.8;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .character {
      padding: 18px 0;
      border-bottom: 1px solid #eee7df;
    }

    .character:last-child {
      border-bottom: none;
    }

    .character h3 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    .character p {
      margin: 0;
      color: #665c53;
      line-height: 1.7;
      white-space: pre-line;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 38px;
      }

      .search {
        flex-direction: column;
      }

      .detail {
        padding: 22px;
      }

      .detail-top {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .detail-cover {
        max-width: 280px;
      }

      .detail h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Tous les résumés</h1>
  <p>Les livres, les personnages et les résumés.</p>
</header>

<main id="libraryPage" class="container">

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Rechercher un livre ou un auteur..."
      aria-label="Rechercher un livre ou un auteur"
    >

    <select id="genre" aria-label="Filtrer par genre">
      <option value="">Tous les genres</option>
    </select>
  </div>

  <div id="books" class="books"></div>

</main>

<main id="detailPage" class="container hidden">

  <a
    class="back-button"
    href="./"
    onclick="retourBibliotheque(); return false;"
  >
    ← Retour 
  </a>

  <div id="detailContent"></div>

</main>
<script>
  // ================================================
  // CONNEXION SUPABASE
  // ================================================

  const SUPABASE_URL =
    "https://cjecagqgpqhzawspqzjs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_8hwEc6y0qiL-vCtUGZ-XSS-9SSQKc9";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // ================================================
  // CONFIGURATION DES URL
  // ================================================

  const RACINE_SITE = "/tous-les-resumes/";
  const RACINE_LIVRES = RACINE_SITE + "livres/";

  let livres = [];

  const libraryPage = document.getElementById("libraryPage");
  const detailPage = document.getElementById("detailPage");

  // ================================================
  // ÉCHAPPER LE HTML
  // ================================================

  function echapperHTML(valeur) {
    return String(valeur ?? "").replace(/[&<>"']/g, caractere => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[caractere]);
  }

  // ================================================
  // OBTENIR L'URL INDIVIDUELLE D'UN LIVRE
  // Utilise les colonnes url ou slug de Supabase.
  // ================================================

  function obtenirUrlLivre(livre) {
    const valeur = String(
      livre.url || livre.slug || ""
    ).trim();

    if (!valeur) {
      console.error(
        "URL ou slug manquant dans Supabase pour le livre :",
        livre.titre,
        livre.id
      );
      return null;
    }

    // URL complète déjà enregistrée dans Supabase.
    if (/^https?:\/\//i.test(valeur)) {
      try {
        const url = new URL(valeur);

        // Ne pas envoyer les visiteurs vers un autre domaine.
        if (url.origin !== window.location.origin) {
          console.error("URL externe ignorée :", valeur);
          return null;
        }

        return url.href;
      } catch {
        return null;
      }
    }

    // Accepter uniquement des chemins internes.
    if (valeur.startsWith("//")) {
      return null;
    }

    let chemin = valeur.replace(/^\/+/, "");

    // Si Supabase contient déjà livres/..., ne pas le doubler.
    if (chemin.startsWith("tous-les-resumes/")) {
      chemin = chemin.slice("tous-les-resumes/".length);
    }

    if (chemin.startsWith("livres/")) {
      return RACINE_SITE + chemin;
    }

    // Un slug seul correspond à un dossier de livre.
    if (
      chemin.includes("..") ||
      chemin.includes("?") ||
      chemin.includes("#")
    ) {
      console.error("Slug invalide :", valeur);
      return null;
    }

    return RACINE_LIVRES + chemin.replace(/\/+$/, "") + "/";
  }

  // ================================================
  // CHARGEMENT DES LIVRES
  // ================================================

  async function chargerLivres() {
    const { data, error } = await supabaseClient
      .from("livres")
      .select("*")
      .order("date_parution", { ascending: false });

    if (error) {
      console.error("Erreur Supabase :", error);

      document.getElementById("books").innerHTML = `
        <div class="empty">
          <h2>Impossible de charger les livres</h2>
          <p>Vérifie la connexion à Supabase.</p>
        </div>
      `;
      return;
    }

    livres = data || [];

    remplirGenres();
    afficherLivres();

    // Prendre en charge les anciens liens #livre-ID.
    naviguerDepuisAdresse();
  }

  // ================================================
  // GENRES
  // ================================================

  function remplirGenres() {
    const select = document.getElementById("genre");
    const genreActuel = select.value;

    const genres = [
      ...new Set(
        livres.map(livre => livre.genre).filter(Boolean)
      )
    ].sort();

    select.innerHTML =
      '<option value="">Tous les genres</option>';

    genres.forEach(genre => {
      const option = document.createElement("option");
      option.value = genre;
      option.textContent = genre;
      select.appendChild(option);
    });

    select.value = genres.includes(genreActuel)
      ? genreActuel
      : "";
  }

  // ================================================
  // AFFICHAGE DE LA BIBLIOTHÈQUE
  // Chaque livre est maintenant un vrai lien HTML.
  // ================================================

  function afficherLivres() {
    const recherche = document
      .getElementById("search")
      .value.toLowerCase().trim();

    const genre = document.getElementById("genre").value;

    const livresFiltres = livres.filter(livre => {
      const titre = String(livre.titre || "").toLowerCase();
      const auteur = String(livre.auteur || "").toLowerCase();

      return (
        (!recherche ||
          titre.includes(recherche) ||
          auteur.includes(recherche)) &&
        (!genre || livre.genre === genre)
      );
    });

    const container = document.getElementById("books");
    container.innerHTML = "";

    if (livresFiltres.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <h2>Aucun livre trouvé</h2>
          <p>Essaie une autre recherche ou un autre genre.</p>
        </div>
      `;
      return;
    }

    livresFiltres.forEach(livre => {
      const url = obtenirUrlLivre(livre);

      // Ne pas générer un lien incorrect si l'URL manque.
      if (!url) {
        console.warn(
          "Livre non cliquable : URL manquante ou invalide",
          livre
        );
        return;
      }

      const couverture = echapperHTML(
        livre.couverture ||
        "https://placehold.co/400x600?text=Pas+de+couverture"
      );

      const lien = document.createElement("a");
      lien.className = "book";
      lien.href = url;
      lien.style.display = "block";
      lien.style.textDecoration = "none";
      lien.style.color = "inherit";

      lien.innerHTML = `
        <img
          class="cover"
          src="${couverture}"
          alt="Couverture de ${echapperHTML(livre.titre)}"
          loading="lazy"
        >

        <div class="book-content">
          <h2>${echapperHTML(livre.titre)}</h2>

          <div class="author">
            ${echapperHTML(livre.auteur)}
          </div>

          ${
            livre.genre
              ? `<span class="genre">${echapperHTML(livre.genre)}</span>`
              : ""
          }
        </div>
      `;

      container.appendChild(lien);
    });
  }

  // ================================================
  // ANCIENS LIENS : #livre-1, #livre-2, ETC.
  // Redirection vers la page individuelle.
  // ================================================

  function ouvrirLienLivre(id) {
    const idNumerique = Number(id);

    if (
      !Number.isSafeInteger(idNumerique) ||
      idNumerique <= 0
    ) {
      return;
    }

    const livre = livres.find(
      element => String(element.id) === String(idNumerique)
    );

    if (!livre) {
      console.error("Livre introuvable pour l'ID :", idNumerique);
      return;
    }

    const url = obtenirUrlLivre(livre);

    if (url) {
      window.location.assign(url);
    }
  }

  function naviguerDepuisAdresse() {
    const correspondance =
      window.location.hash.match(/^#livre-(\d+)$/);

    if (!correspondance) {
      return;
    }

    const id = Number(correspondance[1]);

    if (Number.isSafeInteger(id)) {
      ouvrirLienLivre(id);
    }
  }

  window.addEventListener("hashchange", naviguerDepuisAdresse);

  // ================================================
  // RECHERCHE ET FILTRES
  // ================================================

  document
    .getElementById("search")
    .addEventListener("input", afficherLivres);

  document
    .getElementById("genre")
    .addEventListener("change", afficherLivres);

  // ================================================
  // DÉMARRAGE
  // ================================================

  chargerLivres();
</script>
</body>
</html>
